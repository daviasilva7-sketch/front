<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Mecânica</title>
</head>

<body>
    <header>
        <div class="oficinamecanica">
            <img src="mecanica.png" alt="Logo da oficina mecânica" height="140px">
            <h1>Database Mecânica</h1>
        </div>
    </header>

    <main>
        <form action="agendamento.html">
            <div class="oficinamecanica">
                <img src="mecanica.png" alt="Logo da oficina mecânica" height="140px">
                <h2>Gestão Mecânica</h2>
            </div>

            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" placeholder="Seu nome completo...">

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" placeholder="(00) 00000-0000...">

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" placeholder="Digite seu CPF:">

            <div class="lembrar-senha">
                <label class="checkbox-container">
                    <input type="checkbox" name="lembrarSenha">
                    <span>Lembrar senha</span>
                </label>
                <a href="iforgotmypassword.html">Esqueci a senha</a>
            </div>

            <button type="submit">Entrar</button>
            <h4>Você ainda não tem cadastro? <a class="cadastrar" href="">Cadastre-se</a></h4>
        </form>
    </main>
</body>

</html>
