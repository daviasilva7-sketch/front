<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="iforgotmypassword.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueceu a senha?</title>
</head>

<body>
    <div class="bg-orb orb-one"></div>
    <div class="bg-orb orb-two"></div>

    <main class="reset-card">
        <div class="header-box">
            
                <p class="eyebrow">Segurança</p>
                <h1>Esqueceu a senha?</h1>
            </div>
        </div>

        <p class="subtitle">Crie uma nova senha para continuar com acesso seguro ao sistema.</p>

        <form action="passwordsetting.html" method="get">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input id="email" type="email" placeholder="Digite seu e-mail" required>
            </div>

            <div class="input-group">
                <label for="newpassword">Nova senha</label>
                <input id="newpassword" type="password" placeholder="Digite sua nova senha" required>
            </div>

            <div class="input-group">
                <label for="confirm-password">Confirmar senha</label>
                <input id="confirm-password" type="password" placeholder="Confirme sua nova senha" required>
            </div>

            <div class="password-tip">Use pelo menos 8 caracteres, com letras e números.</div>

            <button type="submit" class="submit-btn">Enviar</button>
        </form>

        <a class="back-link" href="index.html">← Voltar para o login</a>
    </main>
</body>

</html>
