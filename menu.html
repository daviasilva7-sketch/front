<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="cadastro.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>

<body>
    <header>
        <h1>Página de Cadastro</h1>
    </header>
    <h2>Faça seu cadastro!</h2>
    <main>
        <div>
            <form action="info">
                <label for="Nome do Usuário:">Nome do usuário:</label>
                <input type="Seu nome:" placeholder="Seu nome...">
        </div>
        <div class="e-mail">
            <label for="E-mail">E-mail:</label>
            <input type="E-mail" placeholder="Ex.: john@doe.com">
        </div>
        <div class="password">
            <label for="Password">Senha:</label>
            <input type="Colocar senha" placeholder="Insira sua senha:">

            <button>Enviar</button>
            </form>
        </div>
    </main>
</body>

</html>
