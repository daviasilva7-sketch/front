<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="cadastroveiculos.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Veículos</title>
</head>

<body>
    <header>
        <a href="agendamento.html">←</a>
        <h1>Bem-vindo ao cadastro de veículos!</h1>
        <p>Gostaria de publicar?</p>

    </header>
    <main>
        <div>
            <form action="cadastroveiculos.html">
                <label for="nome">Nome completo:</label>
                <input type="text" placeholder="Digite seu nome completo...">
                <label for="carro">Carro:</label>
                <input type="modelo" placeholder="Digite o modelo de seu carro...">
                <label for="placa">Placa:</label>
                <input type="placa-carro" placeholder="Digite a placa de seu carro...">
                <label for="marca">Marca de seu carro:</label>
                <input type="marca-carro" placeholder="Digite a marca de seu carro...">

                <button>Publicar</button>
            </form>
        </div>
    </main>
</body>

</html>
