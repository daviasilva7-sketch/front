<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="cadastrocliente.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <header>
        <a href="agendamento.html">←</a>
        <h1>Cadastro Cliente</h1>
    </header>

    <main class="conteudo-cadastro">
        <div class="imagem-container">
            <img src="https://i.pinimg.com/736x/24/a5/4c/24a54c075ae7a7e7ae16d69e2766cefe.jpg" alt="Usuário">
        </div>

        <form action="agendamento.html" method="get">
            <label for="text">Nome do cliente:</label>
            <input type="text" placeholder="Digite seu nome...">
            <label for="text">Telefone:</label>
            <input type="text" placeholder="Digite seu número de telefone">
            <label for="text">CPF:</label>
            <input type="text" placeholder="Digite eu CPF:">
            <label for="text">Endereço:</label>
            <input type="text" placeholder="Digite seu endereço">
            <button>Confirmar</button>
        </form>
    </main>
</body>

</html>
