<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Mecânica</title>
</head>

<body>
    <header>
        <h1> Oficina - Database Mecânica </h1>
        <p>Confiança que acompanha você em cada quilômetro!</p>
    </header>

    <h3>Faça seu Login</h3>
    <form action="areadetexto">
        <div class="oficinamecanica">
            <img src="mecanica.png" alt="Ícone de oficina mecânica" height="160px">
            <h2>Gestão Mecânica</h2>
        </div>

        <label for="nome">Nome completo: </label>
        <input type="entire-name" placeholder="Seu nome completo...">
        <div class="telefonecelular">
            <label for="telefone">Telefone:</label>
        </div>
        <input type="numero" placeholder="(00) 00000-0000...">
        <label for="cpf">CPF:</label>
        <input type="cpf" placeholder="Digite seu CPF:">
        <div class="lembrar-senha">
            <label class="checkbox-container">
                <input type="checkbox" name="lembrarSenha">
                <span>Lembrar senha</span>
            </label>
            <a href="iforgotmypassword">Esqueci a senha</a>
        </div>
        <button><a href="mecanicasite.html">Entrar</a></button>
        <h4>Você ainda não tem cadastro? → <a class="cadastrar" href="menu.html">Cadastro</a></h4>
    </form>
</body>

</html>
